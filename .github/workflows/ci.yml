name: CI

# push limité à main + pull_request : une PR ne déclenche qu'un seul run
# (pas de doublon push + pull_request sur les branches de travail).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un nouveau push sur la même PR annule le run précédent.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev
      - run: uv run pytest -v --cov --cov-report=html
      - uses: actions/upload-artifact@v4
        with:
          # nom unique par version : sinon les 3 jobs de la matrice se
          # disputent le même nom d'artefact et échouent (409 Conflict).
          name: coverage-html-py${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 7

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv build
