name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: integration (PostgreSQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: fleet
        # pytest tourne sur l'exécuteur (pas dans un conteneur) : on joint la
        # base par le port publié, donc localhost.
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d fleet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/fleet
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run pytest -m integration -v

  image:
    name: image (build, scan, publish)
    runs-on: ubuntu-latest
    # On ne publie pas une image dont les tests ont échoué.
    needs: integration
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Une PR (notamment depuis un fork) n'a pas accès aux secrets.
      - name: Connexion à GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Une seule image, plusieurs noms. Le nom est mis en minuscules par
      # l'action, et les libellés OCI (commit, dépôt, date) sont calculés.
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # (1) Construction + chargement dans le démon local, SANS publier :
      # l'image est scannée avant de partir dans le registre.
      - name: Construire (local)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # (2) Scan. Épinglé par SHA de commit : les tags de trivy-action ont été
      # force-poussés en mars 2026 (CVE-2026-33634). Dependabot met à jour le
      # SHA et le commentaire.
      - name: Scanner l'image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: CRITICAL,HIGH
          # N'échoue que sur ce qui est corrigeable : une alerte sur laquelle
          # on ne peut pas agir est du bruit qui finit par être ignoré.
          ignore-unfixed: true
          exit-code: "1"

      # (3) Publication, hors PR. Les couches viennent du cache : quasi
      # instantané. SBOM et provenance sont attachés à l'image publiée.
      - name: Publier
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
